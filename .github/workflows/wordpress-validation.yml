name: WordPress validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Validate scripts
        run: bash -n scripts/*.sh
      - name: Lint affected PHP entry points
        run: |
          php -l wp-content/themes/divi-child-iahs/functions.php
          php -l wp-content/plugins/wp-file-manager-pro/file_folder_manager_pro.php
          php -l wp-content/plugins/health-check/HealthCheck/class-health-check.php
          php -l scripts/test-health-check-hooks.php
          php -l scripts/test-wp-file-manager-bootstrap.php
      - name: Test Health Check initialization order
        run: php scripts/test-health-check-hooks.php
      - name: Test WP File Manager bootstrap paths
        run: php scripts/test-wp-file-manager-bootstrap.php
      - name: Test release integrity policy
        run: scripts/test-release-integrity.sh
      - name: Reject committed secrets and backups
        run: |
          if git ls-files | grep -E '(^|/)(wp-config.*\.php|\.env($|\.)|.*\.(sql|sql\.gz|wpress))$'; then
            echo 'A forbidden configuration, credential, or backup file is tracked.' >&2
            exit 1
          fi
